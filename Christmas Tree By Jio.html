<script>
(()=>{
'use strict';
const W=720,H=1280,DUR=20.15;
const cv=document.getElementById('cv');
const DPR=Math.min(2,Math.max(1,window.devicePixelRatio||1));
cv.width=W*DPR;cv.height=H*DPR;
const ctx=cv.getContext('2d');
function fit(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
}
addEventListener('resize',fit);fit();

/* ---------- helpers ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rnd=mulberry(7);
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v);};
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x);};
function kf(arr,t){ // piecewise linear [[t,v],...]
  if(t<=arr[0][0])return arr[0][1];
  for(let i=1;i<arr.length;i++){if(t<=arr[i][0]){const a=arr[i-1],b=arr[i];return a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]);}}
  return arr[arr.length-1][1];
}
function kfs(arr,t){ // smooth
  if(t<=arr[0][0])return arr[0][1];
  for(let i=1;i<arr.length;i++){if(t<=arr[i][0]){const a=arr[i-1],b=arr[i];return a[1]+(b[1]-a[1])*sstep(a[0],b[0],t);}}
  return arr[arr.length-1][1];
}

/* ---------- scene constants ---------- */
const CW=6,CH=8,COLS=120,ROWS=160;
const S=300,PITCH=17*Math.PI/180,SIN=Math.sin(PITCH),COS=Math.cos(PITCH);
const CX=360,CY=900;
const Y0=0.02,Y1=2.25,RS=0.98,TAU=Math.PI*2;
const env=y=>RS*(0.03+0.84*Math.pow(1-clamp((y-Y0)/(Y1-Y0)),1.08));
const K_NEEDLE=0,K_TRUNK=1,K_BALL=2,K_LIGHT=3,K_GARLAND=4,K_GIFT=5,K_RIBBON=6,K_SNOW=7;

/* ---------- point cloud ---------- */
const P=[],NRM=[],COL=[],KND=[],T0=[],PH=[],SHN=[];
function add(x,y,z,nx,ny,nz,r,g,b,k,t0,ph,sh){
  const l=Math.hypot(nx,ny,nz)||1;
  P.push(x,y,z);NRM.push(nx/l,ny/l,nz/l);COL.push(r,g,b);KND.push(k);T0.push(t0);PH.push(ph||0);SHN.push(sh||0);
}
const tips=[];
// needles
const NT=24;
for(let i=0;i<NT;i++){
  const y=Y0+0.02+(Y1-Y0-0.06)*i/(NT-1);
  const R=env(y);
  const f=(y-Y0)/(Y1-Y0);
  const nb=Math.floor(7+11*(1-f));
  for(let b=0;b<nb;b++){
    const a=TAU*b/nb+i*0.618*TAU+gauss()*0.12;
    const L=R*(0.82+0.24*rnd());
    const n=Math.floor(200+700*L);
    const dx=Math.cos(a),dz=Math.sin(a),sx=-Math.sin(a),sz=Math.cos(a);
    for(let j=0;j<n;j++){
      const s=Math.pow(rnd(),0.65);
      const sp=(0.03+0.10*s)*gauss();
      const dist=s*L;
      const yy=y+0.07*s*L-0.22*dist*dist+0.022*gauss();
      const px=dx*dist+sx*sp, pz=dz*dist+sz*sp;
      const ao=0.35+0.65*Math.pow(s,1.3);
      const tone=ao*(0.75+0.35*rnd());
      let nx=dx*0.75+gauss()*0.3,ny=0.55+gauss()*0.3,nz=dz*0.75+gauss()*0.3;
      const t0=1.3+5.0*f+0.45*s;
      const sn=(s>0.45)&&(rnd()<0.055*s)&&(ny>0.3);
      if(sn){add(px,yy,pz,0,1,0,0.92,0.95,1.0,K_SNOW,t0,rnd(),0);}
      else{
        const gr=0.10*s*s*rnd(), gg=0.56+0.08*s*rnd();
        add(px,yy,pz,nx,ny,nz,(0.10+gr)*tone,gg*tone,(0.25+0.04*rnd())*tone,K_NEEDLE,t0,rnd(),0);
      }
    }
    tips.push([dx*L*0.93,y+0.07*L-0.22*L*L*0.87,dz*L*0.93,f]);
  }
}
// trunk
for(let hi=0;hi<50;hi++)for(let ai=0;ai<40;ai++){
  const h=-0.05+0.65*hi/49,a=TAU*ai/40;
  const bark=0.75+0.25*Math.sin(h*90+a*3);
  add(0.085*Math.cos(a),h,0.085*Math.sin(a),Math.cos(a),0,Math.sin(a),0.42*bark,0.26*bark,0.14*bark,K_TRUNK,0.75+0.3*(hi/49),0,0);
}
// garland (drooping gold spiral)
for(let ui=0;ui<2600;ui++){
  const u=ui/2599;
  const yg=Y0+0.15+(Y1-Y0-0.45)*u;
  const ag=TAU*3.6*u+0.9;
  const swag=-0.06*Math.abs(Math.sin(ag*2.5));
  const rg=env(yg)*1.0+0.02;
  for(let k=0;k<3;k++){
    const ox=gauss()*0.014,oy=gauss()*0.018,oz=gauss()*0.018;
    const shade=0.5+0.22*rnd();
    add(rg*Math.cos(ag)+ox,yg+swag+oy,rg*Math.sin(ag)+oz,Math.cos(ag),0.3,Math.sin(ag),1.0*shade,0.78*shade,0.25*shade,K_GARLAND,6.2+3.0*u,rnd(),0);
  }
}
// baubles
const bcols=[[0.88,0.10,0.10],[0.88,0.10,0.10],[0.88,0.10,0.10],[0.96,0.72,0.20],[0.96,0.72,0.20],[0.92,0.92,0.97],[0.85,0.12,0.12]];
const tipsSorted=tips.slice().sort(()=>rnd()-0.5);
for(let bi=0;bi<40;bi++){
  const tp=tipsSorted[bi];
  const f=tp[3];
  const rb=0.04+0.07*(1-f);
  const hr=Math.hypot(tp[0],tp[2])||1;
  const cx=tp[0]*1.02,cy=tp[1]-rb*0.9-0.01,cz=tp[2]*1.02;
  const col=bcols[bi%bcols.length];
  const cnt=Math.floor(100+rb*rb*68000);
  const t0=7.0+2.6*rnd();
  for(let j=0;j<cnt;j++){
    let vx=gauss(),vy=gauss(),vz=gauss();const l=Math.hypot(vx,vy,vz)||1;vx/=l;vy/=l;vz/=l;
    add(cx+vx*rb,cy+vy*rb,cz+vz*rb,vx,vy,vz,col[0],col[1],col[2],K_BALL,t0,0,1);
  }
}
// lights (170)
const NLIGHT=170;
const lcols=[[1,0.86,0.45],[1,0.86,0.45],[1,0.78,0.35],[1,0.95,0.8],[1,0.45,0.35],[0.7,0.85,1]];
for(let i=0;i<NLIGHT;i++){
  const tp=tips[Math.floor(rnd()*tips.length)];
  const along=0.55+0.45*rnd();
  const c=lcols[Math.floor(rnd()*lcols.length)];
  add(tp[0]*along*1.03,tp[1]+0.02+0.04*rnd(),tp[2]*along*1.03,tp[0],0.2,tp[2],c[0],c[1],c[2],K_LIGHT,7.3+1.4*i/NLIGHT,rnd()*6.28,0);
}
// gifts
function box(angDeg,rad,w,h,d,rotDeg,cb,cr,t0){
  const a=angDeg*Math.PI/180,cx=Math.cos(a)*rad,cz=Math.sin(a)*rad,ro=rotDeg*Math.PI/180,cr_=Math.cos(ro),sr=Math.sin(ro);

            cream=clamp(pool*1.1);
            if(lum>0.055){
              ch=lum<0.11?'.':lum<0.2?'-':lum<0.33?'=':lum<0.5?'+':'%';
              const g=clamp(lum*2.3,0.22,1);
              cr=(150+105*cream)*g;cg=(165+70*cream)*g;cb=(205+25*cream-60*cream*0)*g;
            }
          }
        }
      }
      if(ch){ctx.fillStyle=css(cr|0,cg|0,cb|0);ctx.fillText(ch,c*CW,r*CH+7);}
    }
  }
  // halos
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<halos.length;i+=6){
    const x=halos[i],y=halos[i+1],ph=halos[i+2],rr=halos[i+3],gg=halos[i+4],bb=halos[i+5];
    const spr=bb>0.9&&rr<0.8?GL.blue:rr>0.95&&gg<0.6?GL.red:gg>0.9&&bb>0.7?GL.white:GL.warm;
    ctx.globalAlpha=0.38*(0.7+0.3*Math.sin(tf*4+ph));
    ctx.drawImage(spr,x-20,y-20,40,40);
  }
  // soft garland/ball glow near warm areas (cheap): broad warm halo behind tree after lights
  const warm=sstep(7.5,9.5,tf);
  if(warm>0){
    const g=ctx.createRadialGradient(CX,620,10,CX,620,380);
    g.addColorStop(0,'rgba(255,190,90,0.07)');g.addColorStop(1,'rgba(255,190,90,0)');
    ctx.globalAlpha=warm;ctx.fillStyle=g;ctx.fillRect(0,200,W,800);
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // star
  if(tf>=9.0){
    const a=clamp((tf-9.0)/0.4);const sc=a<1?1+0.7*Math.pow(a-1,3)+1.7*Math.pow(a-1,2)*0+0:1;
    const eb=a<1?(1+2.70158*Math.pow(a-1,3)+1.70158*Math.pow(a-1,2)):1;
    const sY=CY-2.27*COS*S*zoomAt(tf);
    const Ro=35*eb,Ri=15*eb;
    // glow
    ctx.globalCompositeOperation='lighter';
    const pulse=0.85+0.15*Math.sin(tf*5);
    ctx.globalAlpha=0.55*pulse*a;ctx.drawImage(GL.gold,CX-100,sY-100,200,200);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    // rays
    ctx.save();ctx.strokeStyle='rgba(255,215,110,0.62)';ctx.lineWidth=1.3;ctx.setLineDash([6,4]);ctx.globalAlpha=a;
    const ray=(ang,len,from)=>{ctx.beginPath();ctx.moveTo(CX+Math.sin(ang)*from,sY-Math.cos(ang)*from);ctx.lineTo(CX+Math.sin(ang)*len,sY-Math.cos(ang)*len);ctx.stroke();};
    ray(0,115*eb,22);ray(0.43,98*eb,22);ray(-0.43,98*eb,22);
    ctx.setLineDash([3,4]);ctx.globalAlpha=0.5*a;
    ctx.beginPath();ctx.moveTo(CX-82,sY+5);ctx.lineTo(CX-26,sY+5);ctx.moveTo(CX+26,sY+5);ctx.lineTo(CX+82,sY+5);ctx.stroke();
    ctx.restore();
    // star cells
    ctx.font=FONT;
    const c0=Math.floor((CX-Ro-4)/CW),c1=Math.ceil((CX+Ro+4)/CW),r0=Math.floor((sY-Ro-4)/CH),r1=Math.ceil((sY+Ro+4)/CH);
    for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
      const dx=c*CW+CW/2-CX,dy=r*CH+CH/2-sY;
      const dist=Math.hypot(dx,dy);
      let ang=Math.atan2(dx,-dy);if(ang<0)ang+=TAU;
      const sec=TAU/5,m=ang%sec,hp=sec/2;
      const f=m<hp?m/hp:(sec-m)/hp;
      const rad=Ro+(Ri-Ro)*f;
      if(dist<=rad){
        const hh=hash2(c+7,r+3);
        const core=1-dist/Ro;
        const v=0.8+0.2*hh;
        const rr=255*v,gg=(205+50*core)*v,bb=(80+130*core*core)*v;
        ctx.fillStyle=css(rr|0,gg|0,bb|0);
        ctx.fillText(core>0.45?'#':hh<0.5?'%':'#',c*CW,r*CH+7);
      }
    }
  }
  // bottom fade of render area
  const bf=ctx.createLinearGradient(0,1120,0,1280);
  bf.addColorStop(0,'rgba(5,7,12,0)');bf.addColorStop(1,'rgba(5,7,12,0.94)');
  ctx.fillStyle=bf;ctx.fillRect(0,1120,W,160);
  // HUD
  ctx.textBaseline='middle';
  ctx.font=MONO(13);
  ctx.fillStyle='#ff6b78';ctx.textAlign='right';
  ctx.fillText('t '+pad(tf.toFixed(2),5)+'s',704,22);
  ctx.textAlign='left';
  const rot=(tf*18)%360;
  const lt=Math.round(kf(LET,tf)+(hash2(Math.floor(tf*30),9)-0.5)*(tf>1?5:0));
  const lights=lightsOn;
  ctx.fillStyle='rgba(168,174,192,0.78)';
  ctx.fillText('@999.2006.01.19 · 2026',16,1195);
  ctx.fillStyle='rgba(176,182,200,0.82)';
  ctx.fillText('rotation '+pad(rot.toFixed(2),6)+'°',16,1217);
  ctx.fillText('lights '+pad(lights,4,' '),228,1217);
  ctx.fillText('letters '+lt.toLocaleString('en-US'),16,1239);
  ctx.fillStyle='rgba(200,206,222,0.9)';ctx.textAlign='right';ctx.fillText('made by : Jio',704,1195);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';return;
  // code panel
  ctx.fillStyle='#09090d';ctx.fillRect(0,868,W,H-868);
  ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fillRect(0,867,W,1);
  const idxT=typedIdx(tf);
  let line=FIRST;for(let n=FIRST;n<=LAST;n++){if(lineStart[n]<=idxT)line=n;else break;}
  const col=Math.max(0,Math.min((codeLines[line]||'').length,Math.floor(idxT-lineStart[line]+0.0001)));
  activeLineF+=(line-activeLineF)*(1-Math.exp(-(dt||0.033)/0.09));
  if(Math.abs(line-activeLineF)<0.002)activeLineF=line;
  const LH=29.3,AY=1158;
  ctx.save();
  ctx.beginPath();ctx.rect(0,868,W,H-868);ctx.clip();
  ctx.fillStyle='rgba(255,70,70,0.13)';ctx.fillRect(0,AY-13.5,W,27);
  const first=Math.floor(activeLineF-(AY-868)/LH)-1,lastL=Math.ceil(activeLineF+(H-AY)/LH)+1;
  for(let n=Math.max(1,first);n<=lastL;n++){
    const y=AY+(n-activeLineF)*LH;
    const fade=clamp((y-872)/70);
    if(fade<=0)continue;
    ctx.globalAlpha=fade;
    ctx.font=MONO(16.6);
    ctx.textAlign='right';
    ctx.fillStyle=n===line?'#c3c8d6':'#454957';
    ctx.fillText(String(n),47,y);
    ctx.textAlign='left';
    const full=codeLines[n];
    if(full===undefined)continue;
    let show=full.length;
    if(n>line)show=0;else if(n===line)show=col;
    if(show>0){
      const toks=highlight(n);
      for(let k=0;k<show;k++){
        const x=67+k*10;if(x>W)break;
        const t_=toks[k];if(!t_||t_[0]===' ')continue;
        ctx.fillStyle=t_[1];ctx.fillText(t_[0],x,y);
      }
    }
    if(n===line){
      ctx.globalAlpha=fade;ctx.fillStyle='#ff4d4d';ctx.fillRect(67+col*10,y-11,10,22);
    }
  }
  ctx.restore();
  ctx.globalAlpha=1;ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

/* ---------- playback ---------- */
const au=document.getElementById('au'),startEl=document.getElementById('start');
let playing=false,t0wall=0,last=0;
const qs=new URLSearchParams(location.search);
if(qs.has('t')){ // static frame (debug / thumbnail)
  startEl.remove();
  const tt=parseFloat(qs.get('t'));
  // warm the scroll animation
  activeLineF=75;
  for(let s=Math.max(0,tt-1);s<=tt;s+=0.1)render(s,0.1);
  render(tt,1/30);
  window.__ready=true;
}else{
  activeLineF=75;render(19.8,0.033);
  function loop(now){
    if(!playing)return;
    let t=(now-t0wall)/1000;
    if(t>=DUR){t0wall=now;t=0;activeLineF=75;try{au.currentTime=0;au.play().catch(()=>{});}catch(e){}}
    else if(!au.paused&&au.currentTime>0&&Math.abs(au.currentTime-t)>0.25){t0wall=now-au.currentTime*1000;t=au.currentTime;}
    const dt=Math.min(0.1,(now-last)/1000||0.033);last=now;
    render(t,dt);
    requestAnimationFrame(loop);
  }
  const go=()=>{
    if(playing)return;
    playing=true;startEl.style.display='none';
    activeLineF=75;
    try{au.currentTime=0;au.muted=false;const pr=au.play();if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}
    t0wall=performance.now();last=t0wall;requestAnimationFrame(loop);
  };
  startEl.addEventListener('click',go);
  startEl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go();});
  addEventListener('keydown',e=>{if(!playing&&(e.key==='Enter'||e.key===' '))go();});
}
})();
</script>
